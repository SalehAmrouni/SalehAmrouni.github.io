<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saleh Amrouni // Portfolio</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Integrated Physics Canvas Layering */
    #physics-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background-color: #0f172a; /* Slate dark background */
    }

    /* Ensure desktop UI sits above the background canvas */
    .menu-bar {
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }

    .desktop {
      position: relative;
      z-index: 5;
      pointer-events: none; /* Clicks pass through empty desktop space to canvas */
    }

    .window {
      pointer-events: auto; /* Re-enable clicks for windows, buttons, and links */
    }
  </style>
</head>
<body>

  <!-- Background Physics Canvas -->
  <canvas id="physics-canvas"></canvas>

  <!-- Retro Menu Bar -->
  <header class="menu-bar">
    <span class="menu-item active">FILE</span>
    <span class="menu-item">EDIT</span>
    <span class="menu-item">VIEW</span>
    <span class="menu-item">PROJECTS</span>
    <span class="menu-item">HELP</span>
  </header>

  <main class="desktop">

    <!-- Bio / Intro Window -->
    <section class="window">
      <div class="title-bar">
        <span class="title">C:\USERS\SALEH\README.TXT</span>
        <div class="window-controls">
          <button>_</button>
          <button>&#9633;</button>
          <button class="close">X</button>
        </div>
      </div>
      <div class="window-body">
        <h1>> SALEH AMROUNI</h1>
        <p class="subtitle">Coding projects!</p>
        <p>Building high-performance software, custom tools, and systems from scratch.</p>
      </div>
    </section>

    <!-- Projects Window -->
    <section class="window">
      <div class="title-bar">
        <span class="title">C:\PORTFOLIO\PROJECTS.EXE</span>
        <div class="window-controls">
          <button>_</button>
          <button>&#9633;</button>
          <button class="close">X</button>
        </div>
      </div>
      <div class="window-body">
        <!-- Dynamic Projects Container -->
        <div class="projects-grid" id="projects-container">
          <!-- Dynamically populated via JS -->
        </div>
      </div>
    </section>

  </main>

<script>
  async function fetchProjects() {
    const container = document.getElementById('projects-container');
    
    try {
      const res = await fetch('projects/projects.json');
      const projectFolders = await res.json();

      container.innerHTML = '';

      for (const folder of projectFolders) {
        const basePath = `projects/${folder}`;
        
        try {
          const metaRes = await fetch(`${basePath}/meta.json`);
          const meta = await metaRes.json();

          const card = document.createElement('div');
          card.className = 'project-card';

          // Declare all variables BEFORE template literal generation
          const thumbnailFile = meta.thumbnail || 'thumbnail.png';
          
          const tagsHTML = meta.tags
            ? meta.tags.map(t => `<span>${t}</span>`).join('')
            : '';

          const videoHTML = meta.hasHoverVideo
            ? `<video class="hover-video" src="${basePath}/hover.mp4" loop muted playsinline></video>`
            : '';

          card.innerHTML = `
            <div class="card-header">${folder.toUpperCase()}.DAT</div>
            <div class="img-wrapper">
              <div class="tags-overlay">${tagsHTML}</div>
              <img src="${basePath}/${thumbnailFile}" alt="${meta.title}">
              ${videoHTML}
            </div>
            <div class="card-content">
              <h3>${meta.title}</h3>
              <p>${meta.description}</p>
              <div class="btn-group">
                <a href="project.html?p=${folder}" class="retro-btn">[ VIEW PROJECT ]</a>
              </div>
            </div>
          `;

          // Hover video playback listener
          if (meta.hasHoverVideo) {
            const videoEl = card.querySelector('.hover-video');
            card.addEventListener('mouseenter', () => videoEl.play().catch(() => {}));
            card.addEventListener('mouseleave', () => {
              videoEl.pause();
              videoEl.currentTime = 0;
            });
          }

          container.appendChild(card);
        } catch (e) {
          console.error(`Error loading folder: ${folder}`, e);
        }
      }
    } catch (e) {
      container.innerHTML = '<p style="color:var(--accent);">No projects found or projects/projects.json missing.</p>';
    }
  }

  fetchProjects();
</script>

  <!-- Physics Engine Script -->
  <script>
    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const MAX_BODIES = 150;
    const bodies = [];
    let autoSpawnTimer = 0;
    let globalTime = 0;
    let isMouseDown = false;
    let mousePos = { x: 0, y: 0 };

    const neonColors = ['#38bdf8', '#34d399', '#f43f5e', '#a855f7', '#fbbf24'];

    class Cube {
      constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.size = Math.random() * 18 + 16;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 5;
        this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
      }

      update(dt, gx, gy) {
        this.vx += gx * dt;
        this.vy += gy * dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rotation += this.vRot * dt;

        const half = this.size / 2;
        if (this.x - half < 0) { this.x = half; this.vx *= -0.8; }
        if (this.x + half > canvas.width) { this.x = canvas.width - half; this.vx *= -0.8; }
        if (this.y - half < 0) { this.y = half; this.vy *= -0.8; }
        if (this.y + half > canvas.height) {
          this.y = canvas.height - half;
          this.vy *= -0.8;
          if (Math.random() > 0.6) return false;
        }
        return true;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.2;
        ctx.fillRect(-this.size / 2 - 3, -this.size / 2 - 3, this.size + 6, this.size + 6);

        ctx.globalAlpha = 1.0;
        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);

        ctx.restore();
      }
    }

    function spawn(x, y) {
      if (bodies.length < MAX_BODIES) {
        const vx = (Math.random() - 0.5) * 300;
        const vy = (Math.random() - 0.5) * 300;
        bodies.push(new Cube(x, y, vx, vy));
      }
    }

    window.addEventListener('mousedown', (e) => { 
      if (e.target === canvas || e.target.classList.contains('desktop')) {
        isMouseDown = true; 
        mousePos = { x: e.clientX, y: e.clientY }; 
        spawn(e.clientX, e.clientY); 
      }
    });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => { mousePos = { x: e.clientX, y: e.clientY }; });

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      globalTime += dt;

      if (isMouseDown) spawn(mousePos.x, mousePos.y);

      autoSpawnTimer += dt;
      if (autoSpawnTimer >= 0.4 && bodies.length < MAX_BODIES) {
        autoSpawnTimer = 0;
        bodies.push(new Cube(Math.random() * (canvas.width - 100) + 50, -20, (Math.random() - 0.5) * 150, Math.random() * 100 + 100));
      }

      const gx = Math.sin(globalTime * 1.2) * 250;
      const gy = Math.cos(globalTime * 0.7) * 120 + 180;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = bodies.length - 1; i >= 0; i--) {
        const alive = bodies[i].update(dt, gx, gy);
        if (!alive) {
          bodies.splice(i, 1);
        } else {
          bodies[i].draw();
        }
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
